name: Snyk Monitor Scanning
on:
  release:
    types: [published]
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-scan-ci:
    uses: grafana/security-github-actions/.github/workflows/snyk_monitor.yml@e2690819e9643f013e10f69f3515fea9c026002d # main
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
